# Installed on the Meili box as /etc/systemd/system/perplexity-embedder.service.d/memory.conf (2026-11-09).
# Caps the embedding proxy (peak RSS ~573 MB with the tiny ONNX query encoder loaded) and keeps it out of swap,
# so query-embedding latency doesn't depend on page-in while Meili indexes.
# Rollback: rm this file; systemctl daemon-reload; systemctl restart perplexity-embedder
[Service]
MemoryMax=1200M
MemorySwapMax=0
